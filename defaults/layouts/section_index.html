{{<base}}
{{$main}}
<main>
  <h1>{{page.title}}</h1>
  {{&content}}
  {{#posts | group_by year}}
  <section>
    <h2>{{key}}</h2>
    <ul>
      {{#items}} <li><a href="{{permalink}}">{{&title}}</a><span>{{#date}}<time
            datetime="{{date}}">{{date | format}}</time>{{/date}}</span>
      </li>
      {{/items}}
    </ul>
  </section>
  {{/posts}}
</main>
{{/main}}
{{/base}}
