# This file contains tests for all known mustache syntax errors and their 
# desired error messages. Each one is converted into an Odin test.
name: Missing 2nd closing brace
enable: false # TODO: Re-enable when passing
should: error
input: |
  <menu>
    <a class="goto-top opacity-0" href="#">{{> icons/chevron_up}</a>
    {{#params.social}}
    <a href="{{url}}" target="_blank" rel="noopener noreferrer me" title="{{name}}">{{>* icon}}</a>
    {{/params.social}}
  </menu>
  <p>Proudly built with <a href="https://github.com/sbrow/thor/">Thor</a> and <a
expected: |
  Missing closing brace
   --> <test>:1:1
  1 | <menu>
  2 | <a class="goto-top opacity-0" href="#">{{> icons/chevron_up}</a>
    |                                        ^^ opened           ^ never closed
  3 | {{#params.social}}
  4 |   <a href="{{url}}" target="_blank" rel="noopener noreferrer me" title="{{name}}">{{>* icon}}</a>
  5 | {{/params.social}}
    |
